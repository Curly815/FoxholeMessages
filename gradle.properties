# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# 1536m was enough for debug builds (no minification), but the release build's R8 minify/shrink
# step ran out of heap at this size once the app grew past a certain point this session (the
# v2.1.0 release build hit "R8: java.lang.OutOfMemoryError: Java heap space" - the first CI run
# that ever actually exercised the minified release path, since build-on-pull.yml only builds the
# unminified debug variant). GitHub's ubuntu-latest runners have several GB of RAM to spare, so
# this has real headroom.
org.gradle.jvmargs=-Xmx4096m

# https://blog.gradle.org/introducing-gradle-build-cache
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false

